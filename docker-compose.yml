services:
  todoappdb:
    build:
      context: ./TodoApp/db
      dockerfile: Dockerfile
    container_name: todoappdb
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_usr
      POSTGRES_PASSWORD: letmeinplz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_usr -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  todoapp:
    build:
      context: ./TodoApp
    container_name: todoapp
    depends_on:
      todoappdb:
        condition: service_healthy
    environment:
      ConnectionStrings__TodoDb: "Host=todoappdb;Port=5432;Database=todo_db;Username=todo_usr;Password=letmeinplz"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8082:8080"

volumes:
  postgres-data:
